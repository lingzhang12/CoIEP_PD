<h4 class='d1'>Instructional Decision Log</h4>
<p>This one document holds all four of your Log entries. Submit it each time you turn in a part: complete the entry for that part and leave your earlier entries in place, so the Log grows across the term. In Unit 15 you will polish all four, add the closing reflection, and submit the Log as a whole.</p>
<p>Using an AI tool is not required. You may use CoIEP, another GenAI system, or none at all, and you may choose differently for different parts. What this Log asks for is the same either way: what you were looking for before you started, how sure you are on each of the five critique questions, what you used to check each one, and what you did about the ones you were not sure of.</p>
<h4 class='d1'>Quick Reference</h4>
<h4 class='d2'>The five critique questions</h4>
<ul>
<li><b>Alignment. </b>Does the draft match this student’s documented characteristics and needs from Part 1, and does it connect to the grade-level content standards the student is working toward? Where does it not fit, and what does it leave out?</li>
<li><b>Evidence for instruction.</b> Is each strategy or adaptation genuinely evidence-based for this population and this outcome? What supports it, and what is simply asserted?</li>
<li><b>Source.</b> If the draft named or implied a source, does that source exist, did you retrieve or review it, and does it actually say what is claimed?</li>
<li><b>Practice standards.</b> Does it reflect the relevant HLP(s) and the IDEA definition of SDI, which is adapting the content, methodology, or delivery of instruction to meet the unique needs of the child?</li>
<li><b>Individualization and feasibility.</b> Could this draft apply to almost any student with this disability? Could it actually be delivered in the setting, schedule, and staffing described in your Part 1 profile?</li>
</ul>
<h4 class='d2'>The three source checks</h4>
<h5>With AI assistance:</h5>
<ul>
<li><b>Existence</b>. You located the actual article, chapter, clearinghouse report, or course reading that the AI output named, through the course materials, the IRIS Center, the What Works Clearinghouse, ERIC, or UW Libraries. If you searched and found nothing, say so and treat the citation as fabricated. If it clearly exists but you could not obtain it in time, name where you looked and say what you did instead of relying on it.</li>
<li><b>Fidelity.</b> You read enough of it to confirm it supports the specific claim, not merely that it is on a related topic.</li>
<li><b>Fit.</b> The population, setting, and outcome are close enough to your student to justify the inference, and you say so when they are not.</li>
</ul>
<h5>Without AI assistance:</h5>
<ul>
<li>Support. Every claim you keep names a source you can produce. If your draft named a citation, confirm it exists in the course materials, the IRIS Center, the What Works Clearinghouse, ERIC, or UW Libraries; if you searched and found nothing, treat it as fabricated. If a claim rests on nothing you can point to, treat it as unsupported until you find one. Both are findings, not failures.</li>
<li>Fidelity. You read enough of it to confirm it supports your specific claim, not merely that it is on a related topic. Reading the IRIS module about a study is not reading the study.</li>
<li>Fit. The population, setting, and outcome are close enough to your student to justify the inference, and you say so when they are not.</li>
</ul>
<h4 class='d2'>How to fill the decision record</h4>
<p>Every entry has one table, and its rows are the five critique questions. Work down them in order. </p>
<p>The “How sure am I?” column is about your own judgment, not about whether the draft passed. Use one of three words:</p>
<ul>
<li>Confident: I can defend this judgment against a named standard or my Part 1 data.</li>
<li>Unsure: I could argue it either way.</li>
<li>Guessed: I had nothing to go on yet. Guessed is an honest and scoreable answer, and it is expected early in the term.</li>
</ul>
<p>The “What I used to check it” column is where your evidence goes: a reading, an HLP, the student profile, a database search, a colleague, or nothing yet.</p>
<p>The “What I did next” column is what you did with that judgment, including what you did about the rows you were not sure of. Guessed is never a place to stop.</p>
<div class='tw'><table><tr><th>Critique question</th><th>How sure am I?</th><th>What I used to check it</th><th>What I did next</th></tr><tr><td>Alignment</td><td>Unsure</td><td>The student’s Part 1 profile; the grade-4 content standard</td><td>Rewrote the goal to name expository text</td></tr><tr><td>Evidence for instruction</td><td>Confident</td><td>WWC grades 4 to 9 guide, read it</td><td>Kept the strategy as drafted</td></tr><tr><td>Source</td><td>Confident</td><td>Searched UW Libraries, ERIC, Scholar</td><td>Citation not found; dropped the claim</td></tr><tr><td>Practice standards</td><td>Guessed</td><td>Nothing yet, I could not tell which HLP applied</td><td>Asked in the discussion board; still open</td></tr><tr><td>Individualization and feasibility</td><td>Unsure</td><td>The student schedule and my caseload</td><td>Cut one session; flagged para coverage</td></tr></table></div>
<p>Some fields will not apply in some entries, which is fine. Write one line saying why rather than leaving the space blank. These may be empty, with a reason: which part you expect to be hardest, and any critique question that does not apply to this part. These are never empty: how you made this draft, your criteria, the decision record, and the four Looking back and Next time questions.</p>
<h4 class='d2'>Before you submit each entry, confirm that</h4>
<p>☐  I wrote my criteria before I started drafting.</p>
<p>☐  At least one row is something I changed or something I was not sure about, and the last column says what I did about it.</p>
<p>☐  Every source is accounted for: retrieved and confirmed, not found and treated as fabricated, or real but unobtainable with what I did instead.</p>
<p>☐  I named specific HLPs, IDEA provisions, or content standards, not just “course readings.”</p>
<p>☐  No identifying information about a real student appears anywhere in this Log.</p>

// ===================== PLAN =====================
const LEVELS=["Undergraduate","Graduate","Alternative licensure","In-service PD"];
const STEPS=["Plan","Draft","Critique","Revise","Reflect"];
const PRIV=["Fictional cases only","De-identified real cases"];
function planHTML(){
  const p=S.plan, E=CONTENT.example;
  if(p.challenge==null&&S.share.challenge) p.challenge=S.share.challenge;
  const radio=(n,o)=>"<div class='chk'>"+o.map(x=>"<label><input type='radio' name='"+n+"' "+(p[n]===x?"checked":"")+" onchange=\"S.plan['"+n+"']='"+x+"';save()\">"+x+"</label>").join("")+"</div>";
  const multi=(n,o)=>"<div class='chk'>"+o.map(x=>"<label><input type='checkbox' "+((p[n]||[]).includes(x)?"checked":"")+" onchange=\"tog('"+n+"','"+x+"',this.checked)\">"+x+"</label>").join("")+"</div>";
  const txt=(n,ph)=>"<input type='text' placeholder='"+esc(ph)+"' value='"+esc(p[n]||"")+"' oninput=\"S.plan['"+n+"']=this.value;save()\">";
  return kick("Part 4")+"<h1>Your action plan</h1><p class='lead' style='margin-top:-8px'>One course. Any GenAI tool.</p>"+
   "<button class='btn lt' onclick=\"$('#ex').classList.toggle('hide')\">See an example</button>"+
   "<div class='ex hide' id='ex'><dl><dt>Course</dt><dd>"+esc(E.course)+" ("+esc(E.level)+")</dd><dt>GenAI enters</dt><dd>"+esc(E.enters.join(", "))+"</dd>"+
    "<dt>Points for</dt><dd>"+esc(E.graded)+"</dd><dt>Privacy</dt><dd>"+esc(E.privacy)+"</dd><dt>Challenge &rarr; fix</dt><dd>"+esc(E.challenge)+" &rarr; "+esc(E.response)+"</dd></dl>"+
    "<a href='"+esc(CONTENT.logFile)+"' download>Download the Decision Log template (Word)</a></div>"+
   "<div class='cols'><div>"+
    "<div class='field'><b>1. Level</b>"+radio("level",LEVELS)+"</div>"+
    "<div class='field'><b>2. Course and assignment</b>"+txt("course","")+"</div>"+
    "<div class='field'><b>3. Where GenAI enters</b>"+multi("enters",STEPS)+"</div>"+
    "<div class='field'><b>4. What earns the points</b>"+txt("graded","e.g., the critique")+"</div></div><div>"+
    "<div class='field'><b>5. Privacy rule</b>"+radio("privacy",PRIV)+"</div>"+
    "<div class='field'><b>6. One challenge, and your fix</b>"+txt("challenge","Challenge")+txt("response","Fix")+"</div>"+
    "<div class='field'><b>7. First step, and when</b>"+txt("first","")+"</div></div></div>"+
   "<button class='btn gold' onclick=\"go('myplan')\">Make my plan &rarr;</button>";
}
function tog(n,x,on){ const a=S.plan[n]||[]; S.plan[n]=on?[...new Set(a.concat(x))]:a.filter(y=>y!==x); save(); }
function planRows(){ const p=S.plan; return [["Level",p.level],["Course and assignment",p.course],["Where GenAI enters",(p.enters||[]).join(", ")],
  ["What earns the points",p.graded],["Privacy rule",p.privacy],["Challenge",p.challenge],["Fix",p.response],["First step",p.first]]; }
function summaryHTML(){
  return "<div class='kick noprint'>Part 4</div><div class='summary'><h1 style='margin-bottom:6px'>My GenAI course plan</h1><div class='note'>"+
   new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})+"</div><dl>"+
   planRows().map(([k,v])=>"<dt>"+k+"</dt><dd>"+(v?esc(v):"<span class='note'>&ndash;</span>")+"</dd>").join("")+
   "</dl><p class='note' style='margin-top:12px'>CoIEP: www.coiep.com</p></div>"+
   "<div class='noprint' style='margin-top:12px'><button class='btn' onclick='window.print()'>Save as PDF</button><button class='btn lt' onclick='copyPlan(this)'>Copy text</button><button class='btn lt' onclick=\"go('plan')\">Edit</button></div>";
}
function copyPlan(b){
  const t="My GenAI course plan\n"+planRows().map(([k,v])=>k+": "+(v||"")).join("\n");
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy text",1800);};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(done,()=>fb(t,done)); else fb(t,done);
}
function fb(t,done){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy");done();}catch(e){} a.remove(); }

// ===================== DECK ENGINE =====================
const deck=$("#deck"); let cur=0;
deck.innerHTML=SLIDES.map((s,i)=>"<section class='slide "+(s.cls||"")+"' id='s-"+s.id+"' aria-label='Slide "+(i+1)+"'><div class='inner'></div></section>").join("");
$("#dots").innerHTML=SLIDES.map(()=>"<i></i>").join("");
function render(i){ const el=deck.children[i]; el.firstChild.innerHTML=SLIDES[i].html(); }
function show(i,push){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  // live slides re-render on entry so the plan picks up Part 1 and the summary is current
  if(["plan","myplan","share"].includes(SLIDES[i].id)||!deck.children[i].firstChild.innerHTML) render(i);
  [...deck.children].forEach((s,k)=>s.classList.toggle("on",k===i));
  deck.children[i].scrollTop=0; cur=i;
  $("#count").textContent=(i+1)+" / "+SLIDES.length;
  [...$("#dots").children].forEach((d,k)=>d.classList.toggle("on",k===i));
  $("#prev").disabled=i===0; $("#next").disabled=i===SLIDES.length-1;
  const h="#"+SLIDES[i].id; if(location.hash!==h) history[push?"pushState":"replaceState"](null,"",h);
}
function nav(d){ show(cur+d,true); }
function go(id){ const i=SLIDES.findIndex(s=>s.id===id); if(i>=0) show(i,true); }
function fullscreen(){ const d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); } else { document.exitFullscreen&&document.exitFullscreen(); } }
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||""))) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); nav(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); nav(-1); }
});
let tx=null,ty=null;
deck.addEventListener("touchstart",e=>{ if(e.target.closest(".docview,input,textarea,.tw")){tx=null;return;} tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
deck.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5) nav(dx<0?1:-1); tx=null; },{passive:true});
window.addEventListener("popstate",()=>{ const i=SLIDES.findIndex(s=>"#"+s.id===location.hash); show(i<0?0:i,false); });
(function(){ const i=SLIDES.findIndex(s=>"#"+s.id===location.hash); show(i<0?0:i,false); })();
</script>
